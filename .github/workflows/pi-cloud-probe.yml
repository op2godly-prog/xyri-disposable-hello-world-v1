name: Pi cloud probe (Linux, bounded, manual only)

# Proves Pi + Muse can run on Linux cloud with the user's PC off.
# Manual dispatch only. Never runs in normal CI. Never prints credentials.
# The real model turn runs ONLY when MUSE_KEY_* secrets are configured;
# otherwise non-secret blocker evidence is recorded instead.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Pi harness
        run: npm install -g @earendil-works/pi-coding-agent@0.85.1
      - name: Record cloud evidence (no credentials)
        env:
          MUSE_KEY_1: ${{ secrets.MUSE_KEY_1 }}
          MUSE_KEY_2: ${{ secrets.MUSE_KEY_2 }}
          MUSE_KEY_3: ${{ secrets.MUSE_KEY_3 }}
          MUSE_KEY_4: ${{ secrets.MUSE_KEY_4 }}
        run: |
          mkdir -p pi-cloud-evidence
          python - <<'EOF'
          import json, os, platform, subprocess
          def run(*argv, env=None):
              try:
                  p = subprocess.run(argv, capture_output=True, text=True, timeout=120, env=env)
                  return {"exit": p.returncode, "out": (p.stdout + p.stderr)[-2000:]}
              except Exception as exc:
                  return {"exit": None, "out": type(exc).__name__}
          refs = [r for r in ("MUSE_KEY_1", "MUSE_KEY_2", "MUSE_KEY_3", "MUSE_KEY_4") if os.environ.get(r, "").strip()]
          evidence = {
              "runner_os": platform.system() + " " + platform.release(),
              "runner_arch": platform.machine(),
              "python": platform.python_version(),
              "pi": run("pi", "--version"),
              "provider": "opencode",
              "model": "muse-spark-1.3-contributor-free",
              "configured_ref_count": len(refs),
              "pc_required": False,
          }
          if refs:
              # Same API opencode uses for Muse: Pi's opencode provider reads
              # OPENCODE_API_KEY, so the leased MUSE_KEY value is mapped onto it
              # for exactly this subprocess (in memory only, never logged).
              bridge = dict(os.environ)
              bridge["OPENCODE_API_KEY"] = os.environ[refs[0]]
              prompt = "Reply with the single word OK and nothing else."
              r = run("pi", "--provider", "opencode", "--model", "muse-spark-1.3-contributor-free",
                      "--no-session", "--print", "--", prompt, env=bridge)
              evidence["real_model_turn"] = {"exit": r["exit"], "output_tail": r["out"][-500:],
                  "burned": True, "ref_used": refs[0], "api": "openai-responses",
          else:
              evidence["real_model_turn"] = {"exit": None, "burned": False,
                  "blocker": "no MUSE_KEY_* secrets configured in cloud; real turn not attempted"}
          # Credential values never recorded: assert none leaked into evidence.
          blob = json.dumps(evidence)
          for ref in ("MUSE_KEY_1", "MUSE_KEY_2", "MUSE_KEY_3", "MUSE_KEY_4"):
              value = os.environ.get(ref, "")
              if value and value.strip() in blob:
                  raise SystemExit("credential leak guard tripped")
          with open("pi-cloud-evidence/evidence.json", "w") as fh:
              json.dump(evidence, fh, indent=2, sort_keys=True)
          print(json.dumps({k: v for k, v in evidence.items() if k != "real_model_turn"}, indent=2, sort_keys=True))
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pi-cloud-evidence
          path: pi-cloud-evidence/
          retention-days: 30
